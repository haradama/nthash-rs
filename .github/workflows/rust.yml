name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # Correctness net: lint, unit/property/regression/doc tests must all pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --verbose
      - name: Test (unit + property + regression + doc)
        run: cargo test --verbose
      - name: Rustfmt
        run: cargo fmt --check

  # Every line of the library must be executed by the test suite.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Line coverage (must be complete)
        # Measure unoptimized, incrementally compiled code. Otherwise the same
        # function can be instrumented differently in each test binary (the
        # report then warns about "mismatched data") and its counts are
        # dropped, so the result varies from run to run. The toolchain and
        # cache actions switch incremental compilation off; turn it back on.
        env:
          CARGO_PROFILE_DEV_OPT_LEVEL: 0
          CARGO_PROFILE_TEST_OPT_LEVEL: 0
          CARGO_INCREMENTAL: 1
        run: cargo llvm-cov --fail-under-lines 100 --show-missing-lines

  # The committed reference vectors must be exactly what the C++ reference
  # produces: rebuild it at the pinned commit and compare.
  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Regenerate vectors from the C++ reference and compare
        run: tests/reference/generate.sh --check

  # Build the cargo-fuzz targets so they can't silently rot. Running an actual
  # campaign happens out-of-band; here we only prove the harness compiles.
  fuzz-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Build fuzz targets
        run: cargo +nightly fuzz build
